name: CI - services/hub

on:
  push:
    branches: [main]
    paths:
      - 'services/hub/**'
      - 'openapi/**'
      - 'shared/api/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-hub.yml'
      - '.github/workflows/ci-component.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/hub/**'
      - 'openapi/**'
      - 'shared/api/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-hub.yml'
      - '.github/workflows/ci-component.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-component.yml
    with:
      component_path: services/hub
