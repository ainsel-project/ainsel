name: CI - services/mcp

on:
  push:
    branches: [main]
    paths:
      - 'services/mcp/**'
      # internal/mcp/parity_test.go reads the spec: a spec change must re-run
      # the route-to-tool parity gate on the MCP side too (issue #326).
      - 'openapi/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-mcp.yml'
      - '.github/workflows/ci-component.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/mcp/**'
      - 'openapi/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-mcp.yml'
      - '.github/workflows/ci-component.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-component.yml
    with:
      component_path: services/mcp
