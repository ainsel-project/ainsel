name: CI - services/chat-mcp

on:
  push:
    branches: [main]
    paths:
      - 'services/chat-mcp/**'
      - 'shared/api/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-chat-mcp.yml'
      - '.github/workflows/ci-component.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/chat-mcp/**'
      - 'shared/api/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-chat-mcp.yml'
      - '.github/workflows/ci-component.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-component.yml
    with:
      component_path: services/chat-mcp
