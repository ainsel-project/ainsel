name: PR title

# The PR title is not what release-please reads: PRs merge into main as merge
# commits carrying their branch commits, and release-please-config.json sets
# include-pull-requests: false, so CHANGELOG.md and the version come from the
# commits on main. pr-commits.yml is the check that guards those.
#
# This check still earns its place on the squash path. Squash remains an
# available merge method, and a squash-merged PR's commit subject is its title:
# a title release-please cannot parse is dropped from the changelog entirely and
# cannot bump a version - the change still ships, it just becomes invisible in
# the release. Everything else is hygiene: the title is the first line a reviewer
# reads, and it is what `git log --merges` and the PR list show.
#
# No checkout and no third-party action: the title arrives in the event payload
# and the rule is one regex, so there is nothing to install or supply-chain.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Is a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # The types release-please parses. A scope is optional, `!` marks a
          # breaking change, and the description must be non-empty.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9 ._/-]+\))?!?: [^ ].*'

          if printf '%s' "${TITLE}" | grep -Eq "${pattern}"; then
            echo "ok: ${TITLE}"
            type=$(printf '%s' "${TITLE}" | sed -E 's/^([a-z]+).*/\1/')
            case "${type}" in
              chore|ci|docs|test|style|build) echo "note: '${type}' does not bump the version" ;;
            esac
            exit 0
          fi

          # GitHub titles its own revert PRs 'Revert "<subject>"'. Blocking one
          # would be worse than the changelog gap, so let it through with a note.
          if printf '%s' "${TITLE}" | grep -Eq '^Revert ".*"$'; then
            echo "::warning::'${TITLE}' is not a conventional commit; release-please will not list it in CHANGELOG.md"
            exit 0
          fi

          echo "::error::PR title is not a conventional commit: '${TITLE}'"
          echo ""
          echo "Expected:  <type>(<optional scope>): <description>"
          echo "           feat(api): add persona endpoints"
          echo "           fix(operator): keep the profile MCP token on collision"
          echo "           refactor(api)!: remove Agent.spec.enabledMCPs"
          echo ""
          echo "Types:     feat fix docs style refactor perf test build ci chore revert"
          echo "Breaking:  append ! to the type, or add a 'BREAKING CHANGE: <what>' footer"
          echo "           to the commit that carries the change."
          echo ""
          echo "Why it matters: a squash-merged PR's commit subject is this title, and"
          echo "release-please reads commit subjects on main to compute the next version and"
          echo "to write CHANGELOG.md. A subject it cannot parse is left out of the"
          echo "changelog and does not bump the version. Branch commits are checked"
          echo "separately by pr-commits.yml."
          echo ""
          echo "Fix it by editing the PR title - this check re-runs on edit."
          exit 1
