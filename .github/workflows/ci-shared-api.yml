name: CI - shared/api

on:
  push:
    branches: [main]
    paths:
      - 'shared/api/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-shared-api.yml'
      - '.github/workflows/ci-component.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'shared/api/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-shared-api.yml'
      - '.github/workflows/ci-component.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-component.yml
    with:
      component_path: shared/api
      build_command: go build ./...
