name: CI - operators/agent

on:
  push:
    branches: [main]
    paths:
      - 'operators/agent/**'
      - 'shared/api/**'
      - 'shared/testutil/**'
      - 'go.work'
      - '.github/workflows/ci-operators-agent.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'operators/agent/**'
      - 'shared/api/**'
      - 'shared/testutil/**'
      - 'go.work'
      - '.github/workflows/ci-operators-agent.yml'

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Lint
        working-directory: operators/agent
        run: golangci-lint run ./...
      - name: Set up envtest binaries
        working-directory: operators/agent
        run: make setup-envtest
      - name: Test
        working-directory: operators/agent
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
      - name: Build
        working-directory: operators/agent
        run: make build
      # The e2e suites are behind `//go:build e2e` and invisible to `go test ./...`;
      # this is the only compile check for operators/*/test/e2e (see shared/testutil).
      - name: Compile e2e-tagged code
        working-directory: operators/agent
        run: go vet -tags e2e ./...
