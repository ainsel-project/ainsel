name: CI - operators/agent

on:
  push:
    branches: [main]
    paths:
      - 'operators/agent/**'
      - 'shared/api/**'
      - 'shared/testutil/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-operators-agent.yml'
      - '.github/workflows/ci-component.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'operators/agent/**'
      - 'shared/api/**'
      - 'shared/testutil/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-operators-agent.yml'
      - '.github/workflows/ci-component.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-component.yml
    with:
      component_path: operators/agent
      envtest: true
      vet_e2e: true
