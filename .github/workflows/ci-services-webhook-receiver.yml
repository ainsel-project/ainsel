name: CI - services/webhook-receiver

on:
  push:
    branches: [main]
    paths:
      - 'services/webhook-receiver/**'
      - 'shared/api/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-webhook-receiver.yml'
      - '.github/workflows/ci-component.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/webhook-receiver/**'
      - 'shared/api/**'
      - 'go.work'
      - '.golangci.yml'
      - '.github/workflows/ci-services-webhook-receiver.yml'
      - '.github/workflows/ci-component.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-component.yml
    with:
      component_path: services/webhook-receiver
      build_command: go build ./...
