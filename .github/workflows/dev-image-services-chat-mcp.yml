name: Dev Image - services/chat-mcp

on:
  push:
    branches: [main]
    paths:
      - 'services/chat-mcp/**'
      - 'shared/api/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-chat-mcp.yml'
      - '.github/workflows/dev-image.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/chat-mcp/**'
      - 'shared/api/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-chat-mcp.yml'
      - '.github/workflows/dev-image.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built image to Docker Hub (default: build only)"
        type: boolean
        default: false

# Stays here, not in dev-image.yml: inside a called workflow github.workflow
# names the called workflow, so every component would share one group per ref
# and cancel each other's builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/dev-image.yml
    secrets: inherit
    with:
      image_name: dpinsel/ainsel-chat-mcp
      dockerfile: services/chat-mcp/Dockerfile
      publish: ${{ inputs.publish == true }}
