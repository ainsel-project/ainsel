name: Dev Image - services/hub

on:
  push:
    branches: [main]
    paths:
      - 'services/hub/**'
      - 'shared/api/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-hub.yml'
      - '.github/workflows/dev-image.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/hub/**'
      - 'shared/api/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-hub.yml'
      - '.github/workflows/dev-image.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built image to Docker Hub (default: build only)"
        type: boolean
        default: false

# Stays here, not in dev-image.yml: inside a called workflow github.workflow
# names the called workflow, so every component would share one group per ref
# and cancel each other's builds.
# The images go to GHCR now, and a called workflow cannot ask for more
# permissions than the caller grants it - without this the push fails on a
# 403 that reads like a registry problem.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/dev-image.yml
    secrets: inherit
    with:
      image_name: ainsel-hub-backend
      dockerfile: services/hub/Dockerfile
      publish: ${{ inputs.publish == true }}
