name: CI - workflows

# The dev-image workflows decide, in shell, whether a build becomes a permanent
# registry tag. Nothing else checks that decision until a build runs against the
# real registry, so this does: scripts/test-dev-image-workflows.py executes each
# workflow's metadata step the way the runner would and asserts the outcome for
# every event/branch combination. The tag policy itself is in CONTRIBUTING.md.
#
# The same workflow guards the branch model the tag policy assumes: docs that
# still describe the retired develop/main flow misroute contributor and agent
# work, so scripts/check-branch-model-docs.py fails on any tracked .md that
# references `develop`. The '**/*.md' path filters are what make it fire on
# docs-only PRs (issue #73).
#
# permissions: contents: read — checkout needs a token to fetch the repo;
# an empty permissions block relies on anonymous access, which fails 404 here.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-image-*.yml'
      - '.github/workflows/ci-workflows.yml'
      - 'scripts/test-dev-image-workflows.py'
      - 'scripts/check-branch-model-docs.py'
      - '**/*.md'
      - '*.md'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dev-image-*.yml'
      - '.github/workflows/ci-workflows.yml'
      - 'scripts/test-dev-image-workflows.py'
      - 'scripts/check-branch-model-docs.py'
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert the publish decision for every dev-image workflow
        run: python3 scripts/test-dev-image-workflows.py
      - name: Assert no tracked doc still describes the retired branch model
        run: python3 scripts/check-branch-model-docs.py
