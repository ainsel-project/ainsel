version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
  settings:
    staticcheck:
      # Require a package doc comment ("// Package X ...") in every package
      # (issue #163). ST1000 is off by default in golangci-lint v2 (where
      # stylecheck was merged into staticcheck); keep the other default
      # ST exclusions.
      checks:
        - all
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-ST1023"
    gosec:
      # v1-style keys (exclude-generated, nosec) are intentionally absent:
      # in golangci-lint v2 they are inert here, and an explicit
      # config.global.nosec value is passed to gosec as a tag suffix, which
      # breaks #nosec suppression. nosec suppression is on by default.
      excludes:
        - G706  # Log injection — false positive with slog structured logging
        - G705  # XSS — false positive with JSON API responses

issues:
  max-issues-per-linter: 0
  max-same-issues: 0