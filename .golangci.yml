# golangci-lint configuration for the AInsel monorepo.
#
# Note: the Go CI workflows run `golangci-lint run ./...` with the module
# directory as the working-directory, so they use the module-local
# `.golangci.yml` files (e.g. `services/hub/.golangci.yml`) — not this one.
# This root config is the fallback for ad-hoc runs and keeps the same rule
# set so the modules stay consistent.
#
# Enables gosec with a starter set of security rules (issue #307) and
# requires package doc comments (issue #163).

version: "2"

run:
  timeout: 5m

linters:
  # Preserve default linters (errcheck, gosimple, govet, ineffassign,
  # staticcheck, unused) and add gosec for security scanning.
  enable:
    - gosec
  settings:
    staticcheck:
      # Require a package doc comment ("// Package X ...") in every package
      # (issue #163). ST1000 is off by default in golangci-lint v2 (where
      # stylecheck was merged into staticcheck); keep the other default
      # ST exclusions.
      checks:
        - all
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-ST1023"
    gosec:
      # Full gosec rule set enabled (issue #307). In golangci-lint v2 the
      # gosec-specific options live under `config`.
      excludes:
        - G706  # Log injection — false positive with slog structured logging
        - G705  # XSS — false positive with JSON API responses
      config:
        nosec: true
        exclude_generated: true

issues:
  # Show all gosec findings so they can be triaged.
  max-issues-per-linter: 0
  max-same-issues: 0
