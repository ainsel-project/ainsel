# golangci-lint configuration for the AInsel monorepo — the single source of
# truth for Go linting (issue #207).
#
# Every Go CI workflow runs `golangci-lint run -c ../../.golangci.yml ./...`
# with the module directory as the working-directory, so this file is what CI
# uses for all modules. For ad-hoc runs inside a module directory, pass it
# explicitly the same way:
#
#   golangci-lint run -c ../../.golangci.yml ./...
#
# Without `-c`, golangci-lint falls back to tool defaults (no gosec, no
# ST1000 enforcement) instead of the project rule set. All CI modules sit two
# levels below the repo root; deeper modules (e.g. shared/auth/oidc) need more
# `../` segments in the `-c` path.
#
# Note on path-scoped settings: if `issues.exclude-files` / `exclude-rules`
# paths are ever added here, they resolve relative to the run directory
# (the module directory in CI), not the repo root — write them module-relative.
#
# Enables gosec with a starter set of security rules (issue #307) and
# requires package doc comments (issue #163).

version: "2"

run:
  timeout: 5m

linters:
  # golangci-lint v2's standard set (errcheck, govet, ineffassign,
  # staticcheck, unused) plus gosec for security scanning.
  default: standard
  enable:
    - gosec
  settings:
    staticcheck:
      # Require a package doc comment ("// Package X ...") in every package
      # (issue #163). ST1000 is off by default in golangci-lint v2 (where
      # stylecheck was merged into staticcheck); keep the other default
      # ST exclusions.
      checks:
        - all
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-ST1023"
    gosec:
      # Full gosec rule set enabled (issue #307).
      # v1-style keys (exclude-generated, nosec) are intentionally absent:
      # in golangci-lint v2 they are inert here, and an explicit
      # config.global.nosec value is passed to gosec as a tag suffix, which
      # breaks #nosec suppression. nosec suppression is on by default.
      excludes:
        - G706  # Log injection — false positive with slog structured logging
        - G705  # XSS — false positive with JSON API responses

issues:
  # Show all gosec findings so they can be triaged.
  max-issues-per-linter: 0
  max-same-issues: 0
