apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agents
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub
      ports:
        - port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
