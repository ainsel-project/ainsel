apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-egress-proxy
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: ainsel-agent-egress-proxy
    app.kubernetes.io/instance: ainsel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ainsel-agent-egress-proxy
      app.kubernetes.io/instance: ainsel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainsel-agent-egress-proxy
        app.kubernetes.io/instance: ainsel
        app.kubernetes.io/component: agent-egress-proxy
      annotations:
    spec:
      serviceAccountName: agent-egress-proxy
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: "ubuntu/squid:6.13-25.04_beta"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - SETUID
              - SETGID
              drop:
              - ALL
          command:
            - /usr/bin/squid
            - -N
            - -f
            - /etc/ainsel/squid/squid.conf
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /usr/bin/squidclient
                - -h
                - 127.0.0.1
                - -p
                - "3128"
                - mgr:info
            initialDelaySeconds: 5
            periodSeconds: 20
          livenessProbe:
            exec:
              command:
                - /usr/bin/squidclient
                - -h
                - 127.0.0.1
                - -p
                - "3128"
                - mgr:info
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ainsel/squid
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: agent-egress-proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agents
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub
      ports:
        - port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-egress-proxy
      ports:
        - port: 3128
          protocol: TCP
---
