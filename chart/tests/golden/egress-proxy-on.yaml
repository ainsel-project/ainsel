---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-egress-proxy
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: agent-egress-proxy
data:
  squid.conf: |
    http_port 3128
    visible_name ainsel-agent-egress-proxy

    acl SSL_ports port 443
    acl Safe_ports port 443
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports

    acl allowed_hosts dstdomain
    api.github.com
    api.openai.com
    codeload.github.com
    github.com
    githubusercontent.com
    objects.githubusercontent.com
    raw.githubusercontent.com
    registry.npmjs.org
    registry.yarnpkg.com

    http_access deny !allowed_hosts
    http_access allow CONNECT allowed_hosts
    http_access deny all

    cache deny all
    coredump_dir /var/spool/squid

    access_log daemon:/var/log/squid/access.log
    cache_log daemon:/var/log/squid/cache.log
---
apiVersion: v1
kind: Service
metadata:
  name: agent-egress-proxy
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: ainsel-agent-egress-proxy
    app.kubernetes.io/instance: ainsel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ainsel-agent-egress-proxy
    app.kubernetes.io/instance: ainsel
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-egress-proxy
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
