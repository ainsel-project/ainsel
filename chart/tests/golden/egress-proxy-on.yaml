apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: ainsel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hub
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agents
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: connector-operator
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              ainsel.io/plugin: "true"
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - ports:
        - port: 9090
