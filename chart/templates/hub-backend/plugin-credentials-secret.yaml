{{- /*
Auto-generated secret for plugin credentials, kept stable across upgrades via lookup
(same pattern as local-auth-secrets.yaml). Operators can bring their own via
plugins.credentialSecretName.
*/}}
{{- if not .Values.plugins.credentialSecretName }}
{{- $existing := lookup "v1" "Secret" .Values.namespace "ainsel-plugin-credentials" }}
{{- $secret := "" }}
{{- if and $existing (hasKey ($existing.data | default dict) "secret") }}
{{- $secret = index $existing.data "secret" | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ainsel-plugin-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-backend
type: Opaque
stringData:
  secret: {{ $secret | quote }}
{{- end }}
