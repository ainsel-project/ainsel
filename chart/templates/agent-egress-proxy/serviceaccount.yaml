{{- if .Values.agentEgress.proxy.enabled }}
# The proxy talks to no Kubernetes API; the token is not mounted (see the
# Deployment's automountServiceAccountToken: false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-egress-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-egress-proxy
  {{- with .Values.agentEgress.proxy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
