{{- if .Values.agentEgress.proxy.enabled }}
{{- $domains := splitList "\n" (include "ainsel.egressAllowedDomains" .) -}}
{{- if eq (trim (first $domains)) "" -}}
{{- fail "agentEgress.proxy.enabled requires at least one domain: set agentEgress.proxy.allowedDomains and/or agentEgress.proxy.presets (an empty allow-list would deny every agent HTTPS request)" -}}
{{- end }}
# Squid forward-proxy config for the agent egress allow-list (issue #356).
# The proxy is the security boundary: it only tunnels CONNECT to hosts on the
# allow-list, re-resolving the CONNECT authority itself — a client that puts
# host A in CONNECT and SNI B can only ever reach an allowed host's IP
# (documented first-cut limitation, same as Squid's own).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-egress-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-egress-proxy
data:
  # Generated from agentEgress.proxy.presets + agentEgress.proxy.allowedDomains
  # (deduplicated, sorted). Squid dstdomain semantics: ".example.com" matches
  # the domain and every subdomain; a bare name matches exactly.
  squid.conf: |
    http_port {{ .Values.agentEgress.proxy.port }}
    visible_name ainsel-agent-egress-proxy

    acl SSL_ports port 443
    acl Safe_ports port 443
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports

    acl allowed_hosts dstdomain
    {{- range $domains }}
    {{ . }}
    {{- end }}

    # Deny everything not on the allow-list before any allow rule, so denied
    # hosts land in access.log as TCP_DENIED/403 lines — that log is how an
    # admin sees what an agent tried to reach and widens the list on purpose.
    http_access deny !allowed_hosts
    http_access allow CONNECT allowed_hosts
    http_access deny all

    # Tunneling only: forwarding plain (non-CONNECT) requests would let a
    # client pick the destination itself and bypass the host allow-list.
    cache deny all
    coredump_dir /var/spool/squid

    access_log daemon:/var/log/squid/access.log
    cache_log daemon:/var/log/squid/cache.log
{{- end }}
