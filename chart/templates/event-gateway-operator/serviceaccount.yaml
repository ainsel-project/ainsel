{{- if .Values.eventGatewayOperator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-gateway-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-gateway-operator
  {{- with .Values.eventGatewayOperator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
