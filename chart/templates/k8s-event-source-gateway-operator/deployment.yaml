{{- if .Values.connectorOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-event-source-gateway-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-event-source-gateway-operator
spec:
  replicas: {{ .Values.connectorOperator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ainsel-k8s-event-source-gateway-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainsel-k8s-event-source-gateway-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: k8s-event-source-gateway-operator
        {{- with .Values.connectorOperator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $annotations := default (dict) (deepCopy .Values.connectorOperator.podAnnotations) }}
      {{- /* The policy is read once at startup, so a changed policy has to
             roll the pod. Only add the checksum if the operator isn't already
             carrying one from podAnnotations. */}}
      {{- if not (hasKey $annotations "checksum/plugin-signing") }}
      {{- $_ := set $annotations "checksum/plugin-signing" (include (print $.Template.BasePath "/k8s-event-source-gateway-operator/plugin-signing-configmap.yaml") . | sha256sum) }}
      {{- end }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
    spec:
      serviceAccountName: k8s-event-source-gateway-operator
      {{- with .Values.connectorOperator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.connectorOperator.priorityClassName }}
      priorityClassName: {{ .Values.connectorOperator.priorityClassName }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.connectorOperator.image.repository }}:{{ .Values.connectorOperator.image.tag }}"
          imagePullPolicy: {{ .Values.connectorOperator.image.pullPolicy }}
          {{- with .Values.connectorOperator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --leader-elect
            - --plugin-signing-policy=/etc/ainsel/plugin-signing/policy.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.connectorOperator.hubURL }}
            - name: HUB_URL
              value: {{ .Values.connectorOperator.hubURL | quote }}
            {{- else }}
            - name: HUB_URL
              value: "http://hub-backend.{{ .Values.namespace }}.svc.cluster.local:8080"
            {{- end }}
            {{- if .Values.auth.internalValidateSecret }}
            - name: HUB_INTERNAL_VALIDATE_SECRET
              value: {{ .Values.auth.internalValidateSecret | quote }}
            {{- end }}
            - name: CONNECTOR_IMAGE_PULL_POLICY
              value: {{ .Values.connectorOperator.connectorImagePullPolicy | default "IfNotPresent" | quote }}
            {{- with .Values.connectorOperator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.connectorOperator.resources | nindent 12 }}
          {{- $mounts := list (dict "name" "plugin-signing" "mountPath" "/etc/ainsel/plugin-signing" "readOnly" true) -}}
          {{- with .Values.connectorOperator.extraVolumeMounts }}
          {{- $mounts = concat $mounts . -}}
          {{- end }}
          volumeMounts:
            {{- toYaml $mounts | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- $volumes := list (dict "name" "plugin-signing" "configMap" (dict "name" (printf "%s-plugin-signing" .Release.Name))) -}}
      {{- with .Values.connectorOperator.extraVolumes }}
      {{- $volumes = concat $volumes . -}}
      {{- end }}
      volumes:
        {{- toYaml $volumes | nindent 8 }}
{{- end }}
