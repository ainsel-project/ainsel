{{- if .Values.networkPolicy.enabled }}
{{- /* The DNS pods the scoped port-53 rules allow. k8s-app: kube-dns is the
     upstream CoreDNS label; OpenShift labels its DNS pods dns=default, and a
     cluster whose DNS pods carry neither needs this set, or the scoped rules
     refuse name resolution for the pods they protect. See
     networkPolicy.dnsPodSelector in values.yaml. */ -}}
{{- $dnsPodSelector := .Values.networkPolicy.dnsPodSelector | default (dict "k8s-app" "kube-dns") -}}
# Default deny all ingress to the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow hub ingress from frontend, mcp, agents, webhook connectors,
# and the ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hub
  policyTypes:
    - Ingress
  ingress:
    # From frontend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - port: {{ .Values.hub.port }}
    # From MCP server
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp
      ports:
        - port: {{ .Values.hub.port }}
    # From agent pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agents
      ports:
        - port: {{ .Values.hub.port }}
    # From webhook connector pods (created by the event-source-gateway
    # operator; they publish accepted webhooks to /api/internal/events)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: connector-operator
      ports:
        - port: {{ .Values.hub.port }}
    # From plugin pods (scoped credential callbacks and background
    # credentials; plugins label their pods ainsel.io/plugin: "true")
    - from:
        - podSelector:
            matchLabels:
              ainsel.io/plugin: "true"
      ports:
        - port: {{ .Values.hub.port }}
    # From the ingress controller (browser API traffic: UI -> ingress -> hub)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: {{ .Values.hub.port }}
    # Allow metrics scraping
    - ports:
        - port: {{ .Values.hub.metricsPort }}
---
# Plugin pods accept traffic only from the hub (the plugin proxy) and the
# event-gateway operator (manifest fetch). Egress is left to each plugin's own
# chart, which knows the external services the plugin talks to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plugins
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ainsel.io/plugin: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: event-gateway-operator
---
# Allow Postgres ingress from hub only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub
      ports:
        - port: 5432
---
# Allow frontend ingress (from ingress controller / external)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
---
# Allow MCP ingress (from ingress controller / external)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
---
# Agent egress: allow traffic to known cluster services and DNS, plus HTTPS
# (443/TCP) — unless agentEgress.proxy.enabled, which replaces the open 443
# rule with "the egress proxy only" (see the egress-proxy policy below).
# Standard NetworkPolicy cannot express FQDN-based rules; the proxy enforces
# the domain allow-list above layer 4 (issue #356).
{{- if not .Values.agentEgress.proxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agents
  policyTypes:
    - Egress
  egress:
    # Hub backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub
      ports:
        - port: 8080
    # DNS (scoped to the cluster DNS servers; see networkPolicy.dnsServerNamespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsServerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $dnsPodSelector | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS egress for LLM APIs (ollama.com, opencode.ai, aliyuncs.com, custom providers).
    # TODO(#356): Replace with FQDN-scoped egress via the egress proxy
    # (agentEgress.proxy.enabled) — the proxy path is the intended end state.
    - ports:
        - port: 443
          protocol: TCP
{{- else }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agents
  policyTypes:
    - Egress
  egress:
    # Hub backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub
      ports:
        - port: 8080
    # DNS (scoped to the cluster DNS servers; see networkPolicy.dnsServerNamespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsServerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $dnsPodSelector | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Egress proxy — the only path to any 443 destination. There is
    # deliberately no open 443 rule: agents cannot reach an external proxy
    # either, every HTTPS connection goes through the allow-listed in-cluster
    # proxy (issue #356).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-egress-proxy
      ports:
        - port: {{ .Values.agentEgress.proxy.port }}
          protocol: TCP
    {{- range .Values.agentEgress.proxy.extraEgress }}
    # Extra agent egress peer (agentEgress.proxy.extraEgress): direct paths
    # (e.g. an in-cluster HTTPS LLM endpoint reached via NO_PROXY) need their
    # own rule here — the open 443 rule is gone with the proxy on.
    - to:
        {{- toYaml .to | nindent 8 }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
{{- end }}
{{- if .Values.agentEgress.proxy.enabled }}
---
# Egress proxy: the only pod in the namespace with open 443/TCP egress. It
# terminates the CONNECT and re-resolves the requested host against the
# allow-list (ConfigMap agent-egress-proxy), so the CONNECT authority is the
# enforced name — a client that puts host A in CONNECT and SNI B can only ever
# reach an allowed host's IP (documented limitation, issue #356).
# Ingress is default-deny for the whole namespace and NetworkPolicy is enforced
# on both ends, so the agent-egress egress side alone does NOT open the path:
# the proxy needs its own Ingress allow, and it accepts only the proxy port
# from agent pods — nothing else may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-egress-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent-egress-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Agent pods -> proxy (the only source; see the agent-egress egress side).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agents
      ports:
        - port: {{ .Values.agentEgress.proxy.port }}
          protocol: TCP
  egress:
    # Upstream allow-listed destinations (the proxy enforces the host list).
    # QUIC/UDP 443 stays denied on purpose: an agent must not upgrade to
    # HTTP/3 and bypass the proxy.
    - ports:
        - port: 443
          protocol: TCP
    # DNS (the proxy resolves the CONNECT host itself)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsServerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $dnsPodSelector | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
---
# Agent metrics ingress: the runner extension serves Prometheus metrics on the
# pod's named "metrics" port (see chart/templates/agent-operator/
# podmonitor-agents.yaml). Without an ingress allow, the default-deny policy
# silently refuses Prometheus scrapes and every agent metric (notably
# agent_tokens_used_total) disappears from the observability dashboard.
# Selector matches the PodMonitor (managed-by, not component) so pods created
# before the component label existed are covered too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: agent-operator
  policyTypes:
    - Ingress
  ingress:
    # Allow metrics scraping (same open posture as the hub metrics rule).
    - ports:
        - port: metrics
---
# Webhook ingress for connector receiver pods. Connectors are created
# dynamically by the event-source-gateway operator; external webhooks reach
# them through the ingress controller, and in-cluster producers (e.g. a
# Forgejo running in the same cluster) may deliver to them directly. Both
# paths must be allowed under default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connectors-webhook-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: connector-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        # External webhooks via the ingress controller.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        {{- range .Values.networkPolicy.connectorWebhookSources }}
        # Additional webhook producer (see values: connectorWebhookSources).
        - {{- toYaml . | nindent 10 }}
        {{- end }}
      ports:
        - port: http
---
{{- if .Values.networkPolicy.allowAcmeSolver }}
# Allow the ingress controller to reach cert-manager HTTP-01 solver pods.
# Without this, ACME http01 challenges fail under the default-deny policy
# (solver responds 502 to Let's Encrypt: 'wrong status code 502').
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
{{- end }}
{{- end }}
